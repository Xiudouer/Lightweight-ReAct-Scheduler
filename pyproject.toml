[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-react"
version = "1.0.0"
description = "Dependency-free local ReAct scheduler with Ollama tool calling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
litereact = "lite_react.cli:main"

[tool.setuptools.packages.find]
include = ["lite_react*"]
